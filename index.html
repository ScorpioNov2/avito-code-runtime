<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Avito code</title>
  </head>
  <body>
    <div id="app">
      <header class="top-bar">
        <div class="top-bar__group">
          <div class="brand" aria-label="Avito code">
            <span class="brand__mark">&lt;/</span><span class="brand__name">Avito</span><span class="brand__suffix">code</span>
          </div>
          <span class="top-bar__divider"></span>
          <button id="create-room-button" class="button button--primary" type="button">
            <span class="button__plus" aria-hidden="true">+</span><span id="create-room-label">Create room</span>
          </button>
        </div>

        <div class="top-bar__group">
          <button id="toggle-terminal-button" class="button button--ghost" type="button" aria-pressed="false" title="Show or hide output">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="m7 9 3 3-3 3M13 15h4"/></svg>
            Output
          </button>
          <button id="run-button" class="button button--run" type="button" title="Run code" aria-label="Run code">
            <svg class="icon-play" width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6 4.5v15a1 1 0 0 0 1.5.86l12.5-7.5a1 1 0 0 0 0-1.72L7.5 3.64A1 1 0 0 0 6 4.5Z"/></svg>
            <svg class="icon-stop" width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="5" y="5" width="14" height="14" rx="2"/></svg>
          </button>
          <button id="settings-button" class="button button--secondary" type="button">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>
            Settings
          </button>
        </div>
      </header>

      <main id="workspace" class="workspace">
        <section class="editor-pane"><div id="editor-host" class="editor-host"></div></section>
        <div id="splitter" class="splitter" role="separator" aria-label="Resize output panel"></div>
        <section class="terminal-pane" aria-label="Output">
          <div class="terminal-pane__header">
            <span>Output</span>
            <span class="terminal-pane__actions">
              <button id="clear-terminal-button" class="terminal-pane__action" type="button">Clear</button>
              <button id="close-terminal-button" class="terminal-pane__action terminal-pane__action--icon" type="button" aria-label="Close output">×</button>
            </span>
          </div>
          <div id="terminal-output" class="terminal-pane__body" role="log" aria-live="polite"></div>
        </section>
      </main>

      <footer class="status-bar">
        <select id="language-select" aria-label="Language"></select>
        <div class="font-size-control">
          <input id="font-size-input" type="number" min="8" max="40" aria-label="Font size" />
          <button id="decrease-font-button" type="button" aria-label="Decrease font size">−</button>
          <button id="increase-font-button" type="button" aria-label="Increase font size">+</button>
        </div>
        <div id="member-list" class="member-list"></div>
      </footer>
    </div>

    <dialog id="settings-dialog" class="dialog">
      <form id="settings-form" method="dialog">
        <h2>Settings</h2>
        <label class="field">Your name
          <input id="settings-name-input" maxlength="24" autocomplete="off" placeholder="Your name" />
        </label>
        <label class="field">Theme
          <select id="settings-theme-select"></select>
        </label>
        <div class="dialog__actions">
          <button id="settings-cancel-button" class="button button--secondary" type="button">Cancel</button>
          <button class="button button--primary" type="submit">Save</button>
        </div>
      </form>
    </dialog>

    <div id="toast-container" class="toast-container" aria-live="polite"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
